<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · AMYAM FRESH CHICKEN</title>
<style>
  :root {
    --brand: #E56458;
    --brand-dark: #c94b40;
    --amber: #D5803B;
    --ink: #2C2C2B;
    --muted: #7D7A75;
    --canvas: #FFFFFF;
    --soft: #F9F8F7;
    --surface2: #F0EFED;
    --border: #E6E5E3;
    --blue: #2783DE;   --blue-soft: #E5F2FC;
    --green: #46A171;  --green-soft: #E8F1EC;
    --orange: #D5803B; --orange-soft: #FBEBDE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--soft);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }

  /* Top bar */
  header {
    background: var(--canvas);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .bar {
    max-width: 1080px; margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(160deg, var(--brand) 0%, var(--amber) 100%);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; flex: none;
  }
  .brand-title { font-size: 16px; font-weight: 800; letter-spacing: .04em; line-height: 1.1; white-space: nowrap; }
  .spacer { flex: 1; }
  .clear-row { display: flex; justify-content: flex-end; margin: 2px 0 12px; }
  .mode-badge {
    padding: 6px; border-radius: 999px;
    background: var(--surface2);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .ghost-btn {
    border: 1px solid var(--border); background: var(--canvas); color: var(--ink);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 12px; border-radius: 9px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; min-height: 36px;
  }
  .ghost-btn:hover { background: var(--soft); }
  .ghost-btn.danger { color: var(--brand-dark); border-color: #f0cfcb; }
  .ghost-btn.danger:hover { background: #FCE9E7; }

  main { max-width: 1080px; margin: 0 auto; padding: 24px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
  .stat {
    background: var(--canvas); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px;
  }
  .stat .n { font-size: 28px; font-weight: 800; line-height: 1; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
  .stat.baru .n { color: var(--orange); }
  .stat.proses .n { color: var(--blue); }
  .stat.selesai .n { color: var(--green); }

  /* Filter tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    border: 1px solid var(--border); background: var(--canvas); color: var(--muted);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; min-height: 36px;
  }
  .tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Order cards */
  .orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .order {
    background: var(--canvas); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .order .head { display: flex; align-items: flex-start; gap: 10px; }
  .order .who { flex: 1; min-width: 0; }
  .order .who h3 { font-size: 15px; font-weight: 700; word-break: break-word; }
  .order .who time { font-size: 12px; color: var(--muted); }
  .order .who .hp { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; flex: none; }
  .badge.Baru { background: var(--orange-soft); color: var(--orange); }
  .badge.Diproses { background: var(--blue-soft); color: var(--blue); }
  .badge.Selesai { background: var(--green-soft); color: var(--green); }
  .order .body {
    background: var(--soft); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    color: var(--ink); max-height: 180px; overflow: auto;
  }
  .order .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .act {
    flex: 1; border: none; border-radius: 9px; font-family: inherit; font-size: 13px; font-weight: 700;
    padding: 10px; cursor: pointer; min-height: 40px; min-width: 90px;
  }
  .act.proses { background: var(--blue); color: #fff; }
  .act.selesai { background: var(--green); color: #fff; }
  .act.undo { background: var(--surface2); color: var(--ink); flex: none; min-width: 44px; }
  .act.del { background: transparent; color: var(--brand-dark); border: 1px solid #f0cfcb; flex: none; min-width: 44px; }
  .act:hover { filter: brightness(.96); }

  .empty {
    text-align: center; padding: 64px 20px; color: var(--muted);
    border: 1px dashed var(--border); border-radius: 16px; background: var(--canvas);
  }
  .empty .ico { font-size: 40px; margin-bottom: 12px; }
  .empty h3 { font-size: 16px; color: var(--ink); margin-bottom: 6px; }

  .screen[hidden] { display: none; }
  .menu { max-width: 480px; margin: 26px auto; display: flex; flex-direction: column; gap: 16px; }
  .menu-btn { display: flex; align-items: center; gap: 16px; text-align: left; width: 100%; border: none; border-radius: 18px; padding: 22px 20px; cursor: pointer; font-family: inherit; color: #fff; position: relative; min-height: 100px; box-shadow: 0 8px 22px rgba(0,0,0,.10); }
  .menu-btn.pesanan { background: linear-gradient(150deg, #4aa46f 0%, #2f7a52 100%); }
  .menu-btn.omset { background: linear-gradient(150deg, var(--amber) 0%, #b9652a 100%); }
  .menu-btn:active { transform: translateY(1px); }
  .menu-ico { font-size: 34px; flex: none; }
  .menu-tx { display: flex; flex-direction: column; gap: 3px; }
  .menu-tx b { font-size: 19px; font-weight: 800; }
  .menu-tx small { font-size: 12.5px; font-weight: 500; opacity: .92; }
  .menu-badge { position: absolute; top: 14px; right: 16px; background: #fff; color: #c0392b; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
  .menu-badge:empty { display: none; }
  .back-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--ink); font-family: inherit; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px; cursor: pointer; margin-bottom: 16px; }
  .back-btn:active { opacity: .8; }
  .omset { margin-top: 28px; text-align: center; }
  .omset-btn {
    border: none; border-radius: 12px; padding: 14px 22px; font-family: inherit;
    font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    background: linear-gradient(160deg, var(--green) 0%, #35835b 100%);
    box-shadow: 0 6px 16px rgba(70,161,113,.28); min-height: 48px;
  }
  .omset-panel {
    display: none; margin: 16px auto 0; max-width: 420px; text-align: left;
    background: var(--canvas); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
  }
  .omset-panel.show { display: block; }
  .omset-panel .line { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .omset-panel .line:last-child { border-bottom: none; }
  .omset-panel .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }

  /* Kalkulasi Omset - modul terpisah */
  .om-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .om-info { font-size: 12px; color: #1f3a4d; background: #EAF4FF; border: 1px solid #CFE6FA; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; line-height: 1.55; }
  .om-info b { color: #b9652a; }
  .om-field { margin-bottom: 14px; }
  .om-field > label { display: block; font-size: 16px; font-weight: 800; margin-bottom: 8px; color: #d35400; letter-spacing: .2px; }
  .om-field > label span { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0; }
  .om-acuan { display: flex; align-items: center; gap: 10px; background: var(--soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .om-acuan .val { flex: 1; font-size: 15px; font-weight: 700; }
  .om-acuan .val.empty { color: var(--muted); font-weight: 500; font-style: italic; }
  .om-acuan .edit { border: none; background: var(--surface2); color: var(--ink); font-family: inherit; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 8px; cursor: pointer; min-height: 36px; white-space: nowrap; }
  .om-acuan .edit:hover { filter: brightness(.96); }
  .om-editrow { display: flex; gap: 8px; }
  .om-editrow input { flex: 1; min-width: 0; font-family: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
  .om-editrow .save { border: none; background: var(--green); color: #fff; font-family: inherit; font-size: 13px; font-weight: 700; padding: 0 16px; border-radius: 10px; cursor: pointer; min-height: 44px; white-space: nowrap; }
  .om-input { width: 100%; font-family: inherit; font-size: 23px; font-weight: 800; color: #0a7d3f; padding: 14px; border: 2px solid var(--border); border-radius: 10px; background: #fff; box-sizing: border-box; }
  .om-input::placeholder { color: #b7c2bb; font-weight: 600; }
  .om-area { resize: vertical; min-height: 64px; line-height: 1.55; white-space: pre-wrap; }
  .om-livetotal { font-size: 15px; font-weight: 800; color: #12a454; margin-top: 8px; min-height: 20px; }
  .om-input:focus, .om-editrow input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .om-hr { border: none; border-top: 1px dashed var(--border); margin: 18px 0; }
  .om-calc { width: 100%; border: none; border-radius: 12px; padding: 14px; font-family: inherit; font-size: 15px; font-weight: 800; color: #fff; cursor: pointer; min-height: 50px; background: linear-gradient(160deg, var(--amber) 0%, #b9652a 100%); box-shadow: 0 6px 16px rgba(213,128,59,.28); }
  .om-result { margin-top: 16px; }
  .om-result .line { display: flex; justify-content: space-between; font-size: 14px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .om-result .line:last-child { border-bottom: none; }
  .om-result .note { font-size: 12px; color: var(--ink); margin-top: 12px; line-height: 1.5; background: var(--orange-soft); padding: 11px 13px; border-radius: 10px; }
  .om-result .om-total { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding: 13px 14px; background: var(--green-soft); border-radius: 12px; font-size: 16px; font-weight: 800; color: #2c7a54; }
  .om-result .om-total.minus { background: #FCE9E7; color: #c0392b; }
  .om-result .line.om-setoran { font-size: 15px; font-weight: 800; color: var(--ink); padding: 9px 0; }
  .om-struk { width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px; background: #2c7a54; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .om-struk:active { opacity: .85; }
  .om-inwrap { position: relative; }
  .om-inwrap .om-input { padding-right: 48px; }
  .om-cam { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; background: #fff3e6; border: 1px dashed #e0a877; border-radius: 9px; font-size: 17px; cursor: pointer; z-index: 2; }
  .om-cam:active { opacity: .7; }
  .om-ai-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: #f3f6ff; border: 1px solid #dbe4ff; border-radius: 10px; padding: 8px 10px 8px 12px; margin-bottom: 16px; }
  .om-ai-tag { font-size: 12px; font-weight: 700; color: #33477a; line-height: 1.4; }
  .om-ai-btn { flex: none; border: none; background: #4c6ef5; color: #fff; font-family: inherit; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .om-ai-btn:active { opacity: .8; }
  .om-save-rw { width: 100%; margin-top: 10px; padding: 12px; border: 0; border-radius: 12px; background: #eef2ff; color: #3b5bdb; font-size: 14px; font-weight: 700; cursor: pointer; }
  .om-save-rw:active { opacity: .85; }
  .om-save-rw:disabled { background: #e8f6ee; color: #2c7a54; }
  .om-result .om-potitem span { color: #888; padding-left: 10px; }
  .om-result .om-potitem b { color: #c0392b; font-weight: 700; }
  .om-hist-row { margin: 4px 0 12px; }
  .om-hist-btn { width: 100%; border: 1px solid #e6ddcf; background: #fff8ef; color: #b35d0a; font-family: inherit; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 10px; cursor: pointer; }
  .om-hist-btn:active { opacity: .8; }
  .rw-card { background: #fff; width: 100%; max-width: 420px; max-height: 82vh; overflow-y: auto; border-radius: 16px; padding: 20px; box-shadow: 0 12px 44px rgba(0,0,0,.32); }
  .rw-title { font-size: 16px; font-weight: 800; color: #b35d0a; margin-bottom: 14px; }
  .rw-title span { display: block; font-size: 11px; font-weight: 500; color: #999; margin-top: 2px; }
  .rw-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .rw-empty { color: #999; font-size: 14px; text-align: center; padding: 20px 0; }
  .rw-item { border: 1px solid #eee; border-radius: 12px; padding: 12px 14px; background: #fafafa; }
  .rw-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #333; margin-bottom: 6px; }
  .rw-del { border: 0; background: transparent; font-size: 16px; cursor: pointer; }
  .rw-body { font-size: 13px; color: #555; }
  .rw-pot { font-size: 12px; color: #999; margin-top: 4px; line-height: 1.6; }
  .rw-setoran { margin-top: 8px; font-size: 14px; color: #2c7a54; font-weight: 700; }
  .om-scan { margin-top: 9px; }
  .om-scan-btn { display: inline-flex; align-items: center; gap: 6px; background: #fff3e6; color: #c0620f; border: 1px dashed #e0a877; border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .om-scan-btn:active { opacity: .8; }
  .om-scan-status { font-size: 12px; margin-top: 6px; line-height: 1.5; }
  .om-scan-status .load { color: #8a6d3b; }
  .om-scan-status .ok { color: #2c7a54; }
  .om-scan-status .ok b { font-size: 14px; }
  .om-scan-status .err { color: #c0392b; }
  .struk-ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; z-index: 9999; }
  .struk-card { background: #fff; width: 100%; max-width: 340px; border-radius: 16px; padding: 26px 24px; box-shadow: 0 12px 44px rgba(0,0,0,.32); font-family: 'Courier New', monospace; text-align: center; }
  .struk-brand { font-size: 19px; font-weight: 800; color: #c0620f; }
  .struk-sub { font-size: 12px; letter-spacing: 4px; color: #999; margin-top: 5px; }
  .struk-sep { border-top: 2px dashed #ddd; margin: 15px 0; }
  .struk-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; color: #444; }
  .struk-row b { color: #111; }
  .struk-row.sub { font-size: 12px; color: #999; padding: 0 0 8px; margin-top: -2px; }
  .struk-row.sub b { color: #666; font-weight: 700; }
  .struk-total { display: flex; justify-content: space-between; align-items: center; background: #e8f6ee; border-radius: 11px; padding: 13px 15px; font-size: 16px; font-weight: 800; color: #2c7a54; }
  .struk-time { font-size: 12px; color: #666; margin-top: 4px; line-height: 1.7; }
  .struk-foot { font-size: 13px; color: #333; margin-top: 14px; font-style: italic; }
  .struk-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .struk-btn { border: 0; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; }
  .struk-btn.print { background: #4a6cf7; }
  .struk-btn.send { background: #25D366; }
  .struk-btn.close { background: #8a8a8a; }
  @media print { body > *:not(.struk-ov) { display: none !important; } .struk-ov { position: static; background: #fff; padding: 0; display: block; } .struk-ov .struk-actions { display: none !important; } .struk-card { box-shadow: none; max-width: 100%; margin: 0 auto; } }

  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .bar { padding: 12px 16px; }
    main { padding: 16px; }
  }

  /* Kunci PIN admin */
  body.locked { overflow: hidden; }
  .lock {
    position: fixed; inset: 0; z-index: 100;
    background: var(--soft);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .lock.hide { display: none; }
  .lock-card {
    background: var(--canvas); border: 1px solid var(--border); border-radius: 16px;
    padding: 30px 24px; width: 100%; max-width: 340px; text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.07);
  }
  .lock .logo { margin: 0 auto 14px; width: 52px; height: 52px; font-size: 26px; }
  .lock h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
  .lock p { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
  .lock .err-msg { color: var(--brand-dark); font-size: 13px; min-height: 18px; margin-bottom: 6px; }
  .lock input {
    width: 100%; text-align: center; letter-spacing: .4em; font-size: 22px;
    font-family: inherit; padding: 13px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--soft); margin-bottom: 12px;
  }
  .lock input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(229,100,88,.15); background: #fff; }
  .lock button {
    width: 100%; border: none; border-radius: 12px; padding: 14px;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(160deg, var(--brand) 0%, var(--brand-dark) 100%);
    cursor: pointer; min-height: 48px;
  }
</style>
</head>
<body class="locked">
  <div class="lock" id="lock">
    <div class="lock-card">
      <div class="logo">🔒</div>
      <h2>Panel Admin</h2>
      <p>Masukkan PIN untuk masuk</p>
      <div class="err-msg" id="lockErr"></div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off" />
      <button id="pinBtn">Masuk</button>
    </div>
  </div>

  <header>
    <div class="bar">
      <div class="logo">🐔</div>
      <h1 class="brand-title">AMYAM FRESH CHICKEN</h1>
      <div class="spacer"></div>
      <span class="mode-badge" id="modeBadge" title="Real-time aktif"><span class="dot live"></span></span>
    </div>
  </header>

  <main>
    <div class="screen" id="screenHome">
      <div class="menu">
        <button class="menu-btn pesanan" id="goPesanan">
          <span class="menu-ico">📥</span>
          <span class="menu-tx"><b>Pesanan Masuk</b><small>Lihat &amp; proses pesanan pelanggan</small></span>
          <span class="menu-badge" id="menuBaru"></span>
        </button>
        <button class="menu-btn omset" id="goOmset">
          <span class="menu-ico">💰</span>
          <span class="menu-tx"><b>Kalkulator Omset</b><small>Hitung setoran &amp; cetak struk</small></span>
        </button>
      </div>
    </div>

    <div class="screen" id="screenPesanan" hidden>
      <button class="back-btn" data-home>← Menu</button>
      <div class="stats">
        <div class="stat"><div class="n" id="stTotal">0</div><div class="l">Total</div></div>
        <div class="stat baru"><div class="n" id="stBaru">0</div><div class="l">Baru</div></div>
        <div class="stat proses"><div class="n" id="stProses">0</div><div class="l">Diproses</div></div>
        <div class="stat selesai"><div class="n" id="stSelesai">0</div><div class="l">Selesai</div></div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-f="all">Semua</button>
        <button class="tab" data-f="Baru">Baru</button>
        <button class="tab" data-f="Diproses">Diproses</button>
        <button class="tab" data-f="Selesai">Selesai</button>
      </div>

      <div class="clear-row">
        <button class="ghost-btn danger" id="clearBtn" title="Kosongkan semua pesanan">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
          Bersihkan
        </button>
      </div>

<script>
/*
  AMYAM FRESH CHICKEN - Lapisan data pesanan (dipakai bersama oleh index.html & admin.html)

  MODE:
  - LOKAL (default): pesanan disimpan di localStorage & tersinkron real-time antar-tab
    di perangkat/browser yang SAMA. Cocok untuk uji coba di satu perangkat.
  - CLOUD (lintas perangkat, real-time): isi firebaseConfig di bawah dengan konfigurasi
    proyek Firebase Anda. Pelanggan mengirim dari HP mereka, admin melihat masuk seketika.

  Cara mengaktifkan CLOUD:
  1. Buat proyek gratis di https://console.firebase.google.com
  2. Tambahkan Web App, salin objek konfigurasinya.
  3. Aktifkan Firestore Database (mode production/test).
  4. Tempel konfigurasi ke firebaseConfig di bawah ini.
*/

const firebaseConfig = {
  apiKey: "AIzaSyCTFtSmVZ06ivt06E8pLdgviZZ8JT_AAEk",
  authDomain: "amyam-fresh-chicken.firebaseapp.com",
  projectId: "amyam-fresh-chicken",
  storageBucket: "amyam-fresh-chicken.firebasestorage.app",
  messagingSenderId: "301226610105",
  appId: "1:301226610105:web:57f44c447d60e362f63a68",
  measurementId: "G-VS67E9Z7H0"
}; // <- mode CLOUD aktif (lintas perangkat, real-time)

window.AmyamStore = (function () {
  const KEY = "amyam_orders";
  const listeners = new Set();
  let orders = [];
  let mode = "local";
  let cloud = null;
  let bc = null;

  function uid() {
    return "o_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function emit() {
    const snap = orders.slice();
    listeners.forEach((cb) => cb(snap));
  }
  function sortOrders() {
    orders.sort((a, b) => new Date(b.waktu) - new Date(a.waktu));
  }

  /* ---------------- MODE LOKAL ---------------- */
  function loadLocal() {
    try {
      orders = JSON.parse(localStorage.getItem(KEY) || "[]");
    } catch (e) {
      orders = [];
    }
    sortOrders();
  }
  function persistLocal() {
    localStorage.setItem(KEY, JSON.stringify(orders));
    if (bc) bc.postMessage("changed");
  }
  function initLocal() {
    loadLocal();
    if (orders.length === 0 && window.__AMYAM_DEMO === true) {
      const now = Date.now();
      orders = [
        { id: uid(), nama: "Warung Bu Sri", pesanan: "Ayam potong 5 kg\nDada fillet 2 kg", status: "Baru", waktu: new Date(now - 2 * 60000).toISOString() },
        { id: uid(), nama: "RM Padang Sederhana", pesanan: "Ayam kampung 10 ekor\nHati ampela 1 kg", status: "Diproses", waktu: new Date(now - 18 * 60000).toISOString() },
        { id: uid(), nama: "Toko Frozen Berkah", pesanan: "Sayap 8 kg\nPaha bawah 6 kg\nCeker 3 kg", status: "Selesai", waktu: new Date(now - 65 * 60000).toISOString() },
        { id: uid(), nama: "Katering Melati", pesanan: "Dada fillet 4 kg", status: "Baru", waktu: new Date(now - 1 * 60000).toISOString() },
      ];
      sortOrders();
    }
    try {
      bc = new BroadcastChannel("amyam_orders");
      bc.onmessage = () => {
        loadLocal();
        emit();
      };
    } catch (e) {}
    window.addEventListener("storage", (e) => {
      if (e.key === KEY) {
        loadLocal();
        emit();
      }
    });
  }

  /* ---------------- MODE CLOUD (Firebase Firestore) ---------------- */
  async function initCloud(cfg) {
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const app = appMod.initializeApp(cfg);
    const db = fsMod.getFirestore(app);
    cloud = { db, fs: fsMod };
    mode = "cloud";
    const q = fsMod.query(fsMod.collection(db, "orders"), fsMod.orderBy("waktu", "desc"));
    fsMod.onSnapshot(q, (snap) => {
      orders = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      emit();
    });
  }

  /* ---------------- API PUBLIK ---------------- */
  async function addOrder(data) {
    const order = {
      nama: String(data.nama || "").trim(),
      hp: String(data.hp || "").trim(),
      pesanan: String(data.pesanan || "").trim(),
      status: "Baru",
      waktu: new Date().toISOString(),
    };
    if (mode === "cloud") {
      await cloud.fs.addDoc(cloud.fs.collection(cloud.db, "orders"), order);
    } else {
      order.id = uid();
      orders.unshift(order);
      persistLocal();
      emit();
    }
    return order;
  }

  async function updateStatus(id, status) {
    if (mode === "cloud") {
      await cloud.fs.updateDoc(cloud.fs.doc(cloud.db, "orders", id), { status });
    } else {
      const o = orders.find((x) => x.id === id);
      if (o) {
        o.status = status;
        persistLocal();
        emit();
      }
    }
  }

  async function remove(id) {
    if (mode === "cloud") {
      await cloud.fs.deleteDoc(cloud.fs.doc(cloud.db, "orders", id));
    } else {
      orders = orders.filter((x) => x.id !== id);
      persistLocal();
      emit();
    }
  }

  async function clearAll() {
    if (mode === "cloud") {
      const snap = await cloud.fs.getDocs(cloud.fs.collection(cloud.db, "orders"));
      await Promise.all(snap.docs.map((d) => cloud.fs.deleteDoc(d.ref)));
    } else {
      orders = [];
      persistLocal();
      emit();
    }
  }

  function subscribe(cb) {
    listeners.add(cb);
    cb(orders.slice());
    return () => listeners.delete(cb);
  }

  function getMode() {
    return mode;
  }

  const ready = (async () => {
    if (firebaseConfig) {
      try {
        await initCloud(firebaseConfig);
      } catch (e) {
        console.error("Mode cloud gagal, beralih ke mode lokal:", e);
        initLocal();
        emit();
      }
    } else {
      initLocal();
      emit();
    }
  })();

  return { subscribe, addOrder, updateStatus, remove, clearAll, getMode, ready };
})();

</script>
<script>
  /* ====== PIN ADMIN ======
     Ganti angka di bawah ini dengan PIN pilihan Anda. */
  const ADMIN_PIN = "080888";

  (function initLock() {
    const lock = document.getElementById("lock");
    const input = document.getElementById("pinInput");

    const err = document.getElementById("lockErr");
    if (sessionStorage.getItem("amyam_admin_ok") === "1") {
      lock.classList.add("hide");

      if (input.value === ADMIN_PIN) {

      } else {
        err.textContent = "PIN salah, coba lagi.";
        input.value = "";
        input.focus();
      }

    btn.addEventListener("click", tryUnlock);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
    setTimeout(() => input.focus(), 100);
  })();

  const $ = (id) => document.getElementById(id);
  let allOrders = [];
  let filter = "all";

  function fmtTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = Math.floor((now - d) / 60000);
    if (diff < 1) return "Baru saja";
    if (diff < 60) return diff + " menit lalu";
    return d.toLocaleString("id-ID", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function fmtFull(iso) {
    const d = new Date(iso);
    return d.toLocaleString("id-ID", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  function render() {
    const total = allOrders.length;
    const baru = allOrders.filter((o) => o.status === "Baru").length;
    const proses = allOrders.filter((o) => o.status === "Diproses").length;
    const selesai = allOrders.filter((o) => o.status === "Selesai").length;
    $("stTotal").textContent = total;
    $("stBaru").textContent = baru;
    $("stProses").textContent = proses;
    $("stSelesai").textContent = selesai;
    const mb = $("menuBaru"); if (mb) mb.textContent = baru > 0 ? baru + " baru" : "";

    const list = filter === "all" ? allOrders : allOrders.filter((o) => o.status === filter);
    const wrap = $("orders");

    if (list.length === 0) {
      wrap.innerHTML =
        '<div class="empty" style="grid-column:1/-1"><div class="ico">📭</div><h3>Belum ada pesanan</h3><p>Pesanan dari pelanggan akan muncul di sini secara otomatis.</p></div>';
      return;
    }

    wrap.innerHTML = list
      .map((o) => {
        let actions = "";
        if (o.status === "Baru")
          actions = `<button class="act proses" data-a="proses" data-id="${o.id}">Proses</button>`;
        else if (o.status === "Diproses")
          actions =
            `<button class="act undo" data-a="baru" data-id="${o.id}" title="Kembalikan ke Baru">↩</button>` +
            `<button class="act selesai" data-a="selesai" data-id="${o.id}">Selesai</button>`;
        else
          actions = `<button class="act undo" data-a="proses" data-id="${o.id}" title="Kembali ke Diproses">↩ Buka lagi</button>`;

        return `<div class="order">
          <div class="head">
            <div class="who"><h3>${esc(o.nama)}</h3><time>${fmtFull(o.waktu)} · ${fmtTime(o.waktu)}</time>${o.hp ? `<div class="hp">📞 ${esc(o.hp)}</div>` : ""}</div>
            <span class="badge ${o.status}">${o.status}</span>
          </div>
          <div class="body">${esc(o.pesanan)}</div>
          <div class="actions">
            ${actions}
            <button class="act del" data-a="del" data-id="${o.id}" title="Hapus">🗑</button>
          </div>
        </div>`;
      })
      .join("");
  }

  // Event delegation untuk aksi kartu
  $("orders").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-a]");
    if (!btn) return;
    const id = btn.dataset.id;
    const a = btn.dataset.a;
    if (a === "proses") await AmyamStore.updateStatus(id, "Diproses");
    else if (a === "selesai") await AmyamStore.updateStatus(id, "Selesai");
    else if (a === "baru") await AmyamStore.updateStatus(id, "Baru");
    else if (a === "del") { if (confirm("Hapus pesanan ini?")) await AmyamStore.remove(id); }
  });

  // Tabs
  $("tabs").addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (!t) return;
    filter = t.dataset.f;
    document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
    render();
  });

  $("clearBtn").addEventListener("click", async () => {
    if (confirm("Kosongkan SEMUA pesanan? Tindakan ini tidak bisa dibatalkan.")) await AmyamStore.clearAll();
  });

  // ====== KALKULASI OMSET (modul terpisah, tidak terhubung dengan data pesanan) ======
  const OM_KEYS = { setor: "amyam_harga_setor", jerohan: "amyam_harga_jerohan" };
  const OM_LABEL = { setor: "harga setor", jerohan: "harga jerohan" };

  function omGet(k) { return localStorage.getItem(OM_KEYS[k]) || ""; }
  function omSet(k, v) { localStorage.setItem(OM_KEYS[k], v); }
  function rupiah(n) { return "Rp " + (Number(n) || 0).toLocaleString("id-ID"); }

  function omAcuanRow(k) {
    const v = omGet(k);
    const shown = v
      ? `<span class="val">${rupiah(v)} <span style="font-weight:500;color:var(--muted);font-size:12px">/ kg</span></span>`
      : `<span class="val empty">Belum diatur</span>`;
    return `<div class="om-acuan" data-row="${k}">
        ${shown}
        <button class="edit" data-edit="${k}">${v ? "\u270f\ufe0f Edit" : "Atur"}</button>
      </div>`;
  }

  function renderOmset() {
    $("omsetPanel").innerHTML = `
      <div class="om-title">\ud83d\udcb0 Kalkulasi Omset</div>

      <div class="om-info">ℹ️ Potongan wajib tetap: <b>Rp 255.000</b><br>Potongan bobot — ayam <b>7 kg</b>, jerohan <b>5 kg</b>.</div>

      <div class="om-ai-row"><span class="om-ai-tag" id="aiTag"></span><button class="om-ai-btn" type="button" id="aiKeyBtn">🔑 Scan AI</button></div>

      <div class="om-hist-row"><button class="om-hist-btn" type="button" id="riwayatBtn">📜 Riwayat Setoran (7 hari)</button></div>

      <div class="om-field">
        <label>Harga Setor <span>(harga acuan tetap \u00b7 per kg)</span></label>
        ${omAcuanRow("setor")}
      </div>

      <div class="om-field">
        <label>Harga Jerohan <span>(harga acuan tetap \u00b7 per kg)</span></label>
        ${omAcuanRow("jerohan")}
      </div>

      <hr class="om-hr" />

      <div class="om-field">
        <label>Bobot Ayam (kg) <span>(tiap timbangan tekan Enter ↵ untuk baris baru)</span></label>
        <div class="om-inwrap">
          <textarea class="om-input om-area" id="bobotAyam" rows="4" inputmode="decimal" enterkeyhint="enter" placeholder="25.5&#10;30.1&#10;105.4"></textarea>
          <label class="om-cam" title="Scan foto timbangan (bisa pilih banyak)">📷<input type="file" accept="image/*" id="scanAyam" multiple hidden /></label>
        </div>
        <div class="om-livetotal" id="bobotAyamTotal"></div>
        <div class="om-scan-status" id="scanAyamStatus"></div>
      </div>

      <div class="om-field">
        <label>Bobot Jerohan (kg)</label>
        <div class="om-inwrap">
          <input class="om-input" type="number" inputmode="decimal" step="0.01" id="bobotJerohan" placeholder="0" />
          <label class="om-cam" title="Scan foto timbangan">📷<input type="file" accept="image/*" id="scanJerohan" hidden /></label>
        </div>
        <div class="om-scan-status" id="scanJerohanStatus"></div>
      </div>

      <div class="om-field">
        <label>Potongan Belanja (Rp) <span>(tiap belanja tekan Enter ↵ — contoh: sabun 20000)</span></label>
        <textarea class="om-input om-area" id="potonganLain" rows="3" enterkeyhint="enter" placeholder="sabun 20000&#10;cabe 50000"></textarea>
        <div class="om-livetotal" id="potonganLainPreview"></div>
      </div>

      <div class="om-field">
        <label>Uang Masuk (Rp) <span>(uang yang diterima)</span></label>
        <input class="om-input" type="text" inputmode="numeric" id="uangMasuk" placeholder="contoh: 9.000.000" />
        <div class="om-livetotal" id="uangMasukPreview"></div>
      </div>

      <button class="om-calc" id="calcBtn">\ud83e\uddee Kalkulasi</button>
      <div class="om-result" id="omResult"></div>
    `;
  }

  function omEditMode(k) {
    const row = $("omsetPanel").querySelector(`[data-row="${k}"]`);
    if (!row) return;
    const v = omGet(k);
    row.outerHTML = `<div class="om-editrow" data-row="${k}">
        <input type="number" inputmode="decimal" step="1" id="edit_${k}" value="${v}" placeholder="Masukkan ${OM_LABEL[k]} per kg" />
        <button class="save" data-save="${k}">Simpan</button>
      </div>`;
    const inp = $("edit_" + k);
    inp.focus();
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") omSavePrice(k); });
  }

  function omSavePrice(k) {
    const inp = $("edit_" + k);
    if (!inp) return;
    omSet(k, String(inp.value).replace(/[^0-9.]/g, ""));
    renderOmset();
  }

  function omCalculate() {
    const hSetor = Number(omGet("setor")) || 0;
    const hJerohan = Number(omGet("jerohan")) || 0;
    const wAyam = omParseWeights($("bobotAyam").value);
    const bAyam = omTotalAyam(wAyam);
    const bJerohan = Number($("bobotJerohan").value) || 0;
    const uangMasuk = omUang($("uangMasuk").value);
    const potLainItems = omParsePotongan($("potonganLain").value);
    const potLain = omTotalPotongan(potLainItems);
    const POT_AYAM = 7;        // kg, potongan wajib bobot ayam
    const POT_JEROHAN = 5;     // kg, potongan wajib bobot jerohan
    const POT_WAJIB = 255000;  // Rp, potongan wajib
    const netAyam = bAyam > 0 ? Math.max(0, Math.round((bAyam - POT_AYAM) * 10) / 10) : 0;
    const netJerohan = bJerohan > 0 ? Math.max(0, bJerohan - POT_JEROHAN) : 0;
    const subAyam = Math.round(netAyam * hSetor);
    const subJerohan = Math.round(netJerohan * hJerohan);
    const subtotal = subAyam + subJerohan;
    const omset = subtotal - POT_WAJIB;
    const setoran = omset - potLain;
    if (bAyam <= 0 && bJerohan <= 0) {
      $("omResult").innerHTML = `<div class="note">⚠️ Isi dulu Bobot Ayam dan/atau Bobot Jerohan, lalu ketuk Kalkulasi.</div>`;
      return;
    }
    let html = "";
    if (bAyam > 0) {
      html += `<div class="line"><span>Total bobot ayam (${wAyam.length} entri)</span><b>${bAyam} kg</b></div>`;
      html += `<div class="line"><span>Ayam: ${bAyam} − ${POT_AYAM} kg = ${netAyam} kg × ${rupiah(hSetor)}</span><b>${rupiah(subAyam)}</b></div>`;
    }
    if (bJerohan > 0) {
      html += `<div class="line"><span>Jerohan: ${bJerohan} − ${POT_JEROHAN} kg = ${netJerohan} kg × ${rupiah(hJerohan)}</span><b>${rupiah(subJerohan)}</b></div>`;
    }
    html += `<div class="line"><span>Subtotal</span><b>${rupiah(subtotal)}</b></div>`;
    html += `<div class="line"><span>Potongan wajib</span><b>− ${rupiah(POT_WAJIB)}</b></div>`;
    if (potLain > 0) {
      potLainItems.forEach((it) => {
        html += `<div class="line om-potitem"><span>· ${esc(it.nama)}</span><b>− ${rupiah(it.nilai)}</b></div>`;
      });
      html += `<div class="line"><span>Total potongan belanja</span><b>− ${rupiah(potLain)}</b></div>`;
    }
    if (uangMasuk > 0) {
      const selisih = uangMasuk - setoran;
      html += `<div class="line"><span>Uang masuk</span><b>${rupiah(uangMasuk)}</b></div>`;
      html += `<div class="line om-setoran"><span>JUMLAH SETORAN</span><b>${rupiah(setoran)}</b></div>`;
      html += `<div class="om-total ${selisih < 0 ? "minus" : ""}"><span>SELISIH</span><b>${rupiah(selisih)}</b></div>`;
    } else {
      html += `<div class="om-total ${setoran < 0 ? "minus" : ""}"><span>JUMLAH SETORAN</span><b>${rupiah(setoran)}</b></div>`;
    }
    window.__omLast = { bAyam: bAyam, bJerohan: bJerohan, netAyam: netAyam, netJerohan: netJerohan, hSetor: hSetor, hJerohan: hJerohan, subAyam: subAyam, subJerohan: subJerohan, subtotal: subtotal, potWajib: POT_WAJIB, potAyamKg: POT_AYAM, potJerohanKg: POT_JEROHAN, omset: setoran, potItems: potLainItems, potLain: potLain, uangMasuk: uangMasuk };
    html += `<button class="om-struk" id="strukBtn">🧾 Cetak / Kirim Struk Setoran</button>`;
    html += `<button class="om-save-rw" id="saveRwBtn">💾 Simpan ke Riwayat</button>`;
    $("omResult").innerHTML = html;
  }

  // ====== Riwayat setoran (localStorage, auto-hapus > 7 hari) ======
  const RW_KEY = "amyam_riwayat";
  const RW_MAX_MS = 7 * 24 * 60 * 60 * 1000;
  function riwayatLoad() {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(RW_KEY) || "[]"); } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    const now = Date.now();
    const kept = arr.filter((r) => r && r.waktu && (now - new Date(r.waktu).getTime()) <= RW_MAX_MS);
    if (kept.length !== arr.length) localStorage.setItem(RW_KEY, JSON.stringify(kept));
    return kept;
  }
  function riwayatStore(arr) { localStorage.setItem(RW_KEY, JSON.stringify(arr)); }
  function saveCurrentToRiwayat(btn) {
    const d = window.__omLast;
    if (!d) { alert("Lakukan Kalkulasi dulu sebelum menyimpan."); return; }
    const arr = riwayatLoad();
    arr.unshift({
      id: "rw_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      waktu: new Date().toISOString(),
      bAyam: d.bAyam, bJerohan: d.bJerohan,
      potItems: d.potItems || [], potLain: d.potLain || 0,
      uangMasuk: d.uangMasuk || 0, omset: d.omset
    });
    riwayatStore(arr);
    if (btn) { btn.textContent = "✅ Tersimpan ke Riwayat"; btn.disabled = true; setTimeout(() => { btn.textContent = "💾 Simpan ke Riwayat"; btn.disabled = false; }, 2500); }
  }
  function riwayatDelete(id) {
    riwayatStore(riwayatLoad().filter((r) => r.id !== id));
    renderRiwayatList();
  }
  function renderRiwayatList() {
    const box = document.getElementById("rwList");
    if (!box) return;
    const arr = riwayatLoad();
    if (!arr.length) { box.innerHTML = '<div class="rw-empty">Belum ada riwayat tersimpan.</div>'; return; }
    box.innerHTML = arr.map((r) => {
      const pot = (r.potItems && r.potItems.length)
        ? '<div class="rw-pot">' + r.potItems.map((it) => '· ' + esc(it.nama) + ' (' + rupiah(it.nilai) + ')').join('<br>') + '</div>'
        : '';
      return '<div class="rw-item">' +
        '<div class="rw-head"><b>' + fmtFull(r.waktu) + '</b><button class="rw-del" data-del="' + r.id + '">🗑️</button></div>' +
        '<div class="rw-body">Ayam <b>' + r.bAyam + '</b> kg · Jerohan <b>' + r.bJerohan + '</b> kg' +
        (r.potLain ? ' · Potongan belanja ' + rupiah(r.potLain) : '') + '</div>' +
        pot +
        '<div class="rw-setoran">JUMLAH SETORAN: <b>' + rupiah(r.omset) + '</b></div>' +
      '</div>';
    }).join('');
  }
  function openRiwayat() {
    const ov = document.createElement("div");
    ov.className = "struk-ov"; ov.id = "rwOv";
    ov.innerHTML =
      '<div class="rw-card">' +

      if (e.target.closest("#rwCloseBtn")) ov.remove();
    });

  function shareStruk(d, hari, tgl, jam) {
    const items = (d.potItems || []);
    const W = 620, s = 2;
    const ops = [];
    let y = 120;
    ops.push({ t: 'dash', y: y }); y += 4;
    if (d.bAyam > 0) {
      y += 40; ops.push({ t: 'row', label: 'Bobot Ayam', val: d.bAyam + ' Kg', y: y });
      y += 26; ops.push({ t: 'row', label: '(−' + d.potAyamKg + ' kg) ' + d.netAyam + ' kg × ' + rupiah(d.hSetor), val: rupiah(d.subAyam), y: y, opt: { lf: '14px Arial', vf: '15px Arial', lc: '#999999', vc: '#444444', x: 56 } });
    }
    if (d.bJerohan > 0) {
      y += 38; ops.push({ t: 'row', label: 'Bobot Jerohan', val: d.bJerohan + ' Kg', y: y });
      y += 26; ops.push({ t: 'row', label: '(−' + d.potJerohanKg + ' kg) ' + d.netJerohan + ' kg × ' + rupiah(d.hJerohan), val: rupiah(d.subJerohan), y: y, opt: { lf: '14px Arial', vf: '15px Arial', lc: '#999999', vc: '#444444', x: 56 } });
    }
    y += 30; ops.push({ t: 'dash', y: y });
    y += 36; ops.push({ t: 'row', label: 'Subtotal', val: rupiah(d.subtotal), y: y });
    y += 34; ops.push({ t: 'row', label: 'Potongan wajib', val: '− ' + rupiah(d.potWajib), y: y, opt: { vc: '#aa2233' } });
    items.forEach((it) => { y += 30; ops.push({ t: 'row', label: '· ' + it.nama, val: '− ' + rupiah(it.nilai), y: y, opt: { lf: '15px Arial', vf: '15px Arial', lc: '#777777', vc: '#aa2233', x: 56 } }); });
    if (d.potLain > 0) { y += 32; ops.push({ t: 'row', label: 'Total potongan belanja', val: '− ' + rupiah(d.potLain), y: y, opt: { vc: '#aa2233' } }); }
    y += 28; ops.push({ t: 'dash', y: y });
    y += 24; ops.push({ t: 'box', y: y }); y += 68;
    y += 28; ops.push({ t: 'dash', y: y });
    y += 38; ops.push({ t: 'center', text: hari + ', ' + tgl, y: y, font: '16px Arial', color: '#555555' });
    y += 26; ops.push({ t: 'center', text: 'Pukul ' + jam + ' WIB', y: y, font: '16px Arial', color: '#555555' });
    y += 44; ops.push({ t: 'center', text: 'Terima kasih 🙏', y: y, font: 'italic 16px Arial', color: '#333333' });
    y += 26;
    const H = y;
    const cv = document.createElement('canvas'); cv.width = W * s; cv.height = H * s;
    const c = cv.getContext('2d'); c.scale(s, s);
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
    c.strokeStyle = '#e2c9a8'; c.lineWidth = 3; c.strokeRect(16, 16, W - 32, H - 32);
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillStyle = '#c0620f'; c.font = 'bold 27px Arial'; c.fillText('🐔 AMYAM FRESH CHICKEN', W / 2, 60);
    c.fillStyle = '#999999'; c.font = '14px Arial'; c.fillText('S T R U K   S E T O R A N', W / 2, 90);
    const dash = (yy) => { c.strokeStyle = '#cccccc'; c.lineWidth = 1.5; c.setLineDash([7, 6]); c.beginPath(); c.moveTo(44, yy); c.lineTo(W - 44, yy); c.stroke(); c.setLineDash([]); };
    const row = (label, val, yy, opt) => { opt = opt || {}; c.textAlign = 'left'; c.fillStyle = opt.lc || '#666666'; c.font = opt.lf || '18px Arial'; c.fillText(label, opt.x || 48, yy); c.textAlign = 'right'; c.fillStyle = opt.vc || '#222222'; c.font = opt.vf || 'bold 20px Arial'; c.fillText(val, W - 48, yy); };
    ops.forEach((o) => {
      if (o.t === 'dash') dash(o.y);
      else if (o.t === 'row') row(o.label, o.val, o.y, o.opt);
      else if (o.t === 'center') { c.textAlign = 'center'; c.fillStyle = o.color; c.font = o.font; c.fillText(o.text, W / 2, o.y); }
      else if (o.t === 'box') { c.fillStyle = '#e8f6ee'; c.fillRect(44, o.y, W - 88, 68); const boxY = o.y + 42; c.textAlign = 'left'; c.fillStyle = '#2c7a54'; c.font = 'bold 20px Arial'; c.fillText('JUMLAH SETORAN', 62, boxY); c.textAlign = 'right'; c.font = 'bold 24px Arial'; c.fillText(rupiah(d.omset), W - 62, boxY); }
    });
    cv.toBlob(async (blob) => {
      const file = new File([blob], 'struk-setoran-amyam.png', { type: 'image/png' });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Struk Setoran AMYAM', text: 'Struk Setoran AMYAM FRESH CHICKEN' });
          return;
        }
      } catch (err) { if (err && err.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'struk-setoran-amyam.png'; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 1500);
    }, 'image/png');
  }

  // Parsing bobot ayam: banyak nominal kecil -> total
  function omParseWeights(str) {
    const m = String(str || "").match(/\d+(?:[.,]\d+)?/g);
    return m ? m.map((s) => Number(s.replace(",", "."))) : [];
  }
  function omTotalAyam(weights) {
    const arr = Array.isArray(weights) ? weights : omParseWeights(weights);
    const sumRaw = arr.reduce((a, b) => a + b, 0);
    const sum2 = Math.round(sumRaw * 100) / 100;   // bersihkan noise float
    return Math.floor(sum2);                       // total bobot ayam tanpa desimal
  }
  function omUpdateAyamTotal() {
    const el = $("bobotAyamTotal");
    if (!el) return;
    const w = omParseWeights($("bobotAyam").value);
    el.textContent = w.length ? `∑ Total bobot ayam: ${omTotalAyam(w)} kg  ·  ${w.length} entri` : "";
  }

  function omUang(str) {
    return Number(String(str || "").replace(/[^\d]/g, "")) || 0;
  }
  function omUpdateUangPreview() {
    const el = $("uangMasukPreview");
    if (!el) return;
    const v = omUang($("uangMasuk").value);
    el.textContent = v ? `= ${rupiah(v)}` : "";
  }

  // Parsing potongan lain-lain: tiap baris "nama nominal" -> {nama, nilai}
  function omParsePotongan(str) {
    const lines = String(str || "").split(/\n+/);
    const items = [];
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      const m = line.match(/^(.*?)[\s:=.-]*(\d[\d.,]*)\s*$/);
      if (!m) continue;
      const nama = (m[1] || "").trim() || "Lain-lain";
      const nilai = Number(String(m[2]).replace(/[^\d]/g, "")) || 0;
      if (nilai <= 0) continue;
      items.push({ nama: nama, nilai: nilai });
    }
    return items;
  }
  function omTotalPotongan(items) {
    return (items || []).reduce((a, b) => a + (Number(b.nilai) || 0), 0);
  }
  function omUpdatePotonganPreview() {
    const el = $("potonganLainPreview");
    if (!el) return;
    const items = omParsePotongan($("potonganLain").value);
    const tot = omTotalPotongan(items);
    el.textContent = items.length ? `∑ Potongan belanja: ${rupiah(tot)}  ·  ${items.length} item` : "";
  }

  // Update total & preview secara live saat mengetik
  $("omsetPanel").addEventListener("input", (e) => {
    if (!e.target) return;
    if (e.target.id === "bobotAyam") omUpdateAyamTotal();
    if (e.target.id === "potonganLain") omUpdatePotonganPreview();
    if (e.target.id === "uangMasuk") omUpdateUangPreview();
  });

  // ====== Scan AI (Google Gemini) — akurat baca layar timbangan digital ======
  const AI_MODEL = "gemini-flash-latest";
  function aiKey() { const k = localStorage.getItem("amyam_gemini_key"); return (k && k !== "__none__") ? k : ""; }
  function updateAiTag() {
    const el = $("aiTag"); if (!el) return;
    if (aiKey()) el.innerHTML = '🤖 Scan AI: <b style="color:#2c7a54">Gemini aktif</b>';
    else el.textContent = "Scan AI: nonaktif (pakai pembaca bawaan)";
  }
  function ensureAiChoice() {
    if (localStorage.getItem("amyam_gemini_key") !== null) return;
    const k = (prompt("Baca angka timbangan pakai AI Google Gemini? (jauh lebih akurat)\n\nTempel API Key GRATIS dari:\nhttps://aistudio.google.com/apikey\n\n(Kosongkan lalu OK = pakai pembaca bawaan)") || "").trim();
    localStorage.setItem("amyam_gemini_key", k || "__none__");
    updateAiTag();
  }
  function promptAiKey() {
    const cur = aiKey();
    const k = (prompt("API Key Google Gemini untuk Scan AI (akurat).\nAmbil gratis: https://aistudio.google.com/apikey\n\n\u2022 Tempel key = AKTIFKAN\n\u2022 Kosongkan lalu OK = MATIKAN (pakai bawaan)", cur) || "").trim();
    localStorage.setItem("amyam_gemini_key", k || "__none__");
    updateAiTag();
    alert(k ? "\u2705 Scan AI Gemini AKTIF." : "Scan AI dimatikan \u2014 pakai pembaca bawaan.");
  }
  function fileToB64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => { const s = String(r.result); res(s.slice(s.indexOf(",") + 1)); };
      r.onerror = () => rej(new Error("Gagal membaca file gambar"));
      r.readAsDataURL(file);
    });
  }
  async function geminiRead(file) {
    const key = aiKey();
    const b64 = await fileToB64(file);
    const body = { contents: [{ parts: [
      { text: "Foto ini layar timbangan digital. Bacakan HANYA angka berat yang tampil. Balas cuma angkanya dalam kilogram, pakai TITIK sebagai desimal, tanpa satuan/kata lain. Contoh balasan: 30.6" },
      { inline_data: { mime_type: file.type || "image/jpeg", data: b64 } }
    ] }], generationConfig: { temperature: 0 } };
    const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + AI_MODEL + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify(body)
    });
    if (res.status === 400 || res.status === 403) { localStorage.removeItem("amyam_gemini_key"); updateAiTag(); throw new Error("API Key AI salah/ditolak \u2014 scan lagi lalu tempel key yang benar."); }
    if (!res.ok) throw new Error("AI error " + res.status + " (cek koneksi/kuota)");
    const data = await res.json();
    const parts = ((((data.candidates || [])[0] || {}).content) || {}).parts || [];
    const raw = parts.map((p) => p.text || "").join(" ");
    const m = raw.match(/\d+(?:\.\d+)?/);
    if (!m) return null;
    return Math.floor(parseFloat(m[0]) * 10) / 10;
  }
  async function readOne(file, statusEl) {
    if (aiKey()) return await geminiRead(file);
    const worker = await getOcrWorker(statusEl);
    const cv = await preprocessImage(file);
    const rec = await worker.recognize(cv);
    return parseScanNumber(rec && rec.data ? rec.data.text : "");
  }

  // ====== OCR: baca angka bobot dari foto timbangan (client-side, gambar tidak disimpan) ======
  let ocrWorker = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = () => res();
      s.onerror = () => rej(new Error("Gagal memuat mesin OCR (butuh internet)"));
      document.head.appendChild(s);
    });
  }
  async function getOcrWorker(statusEl) {
    if (ocrWorker) return ocrWorker;
    if (statusEl) statusEl.innerHTML = '<span class="load">⏳ Menyiapkan mesin OCR (sekali saja, ~beberapa detik)...</span>';
    await loadTesseract();
    ocrWorker = await window.Tesseract.createWorker("eng");
    await ocrWorker.setParameters({ tessedit_char_whitelist: "0123456789." });
    return ocrWorker;
  }
  async function preprocessImage(file) {
    const bmp = await createImageBitmap(file);
    const maxW = 900;
    const scale = bmp.width > maxW ? maxW / bmp.width : 1.5;
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const cx = cv.getContext("2d"); cx.drawImage(bmp, 0, 0, w, h);
    const im = cx.getImageData(0, 0, w, h); const p = im.data;
    for (let i = 0; i < p.length; i += 4) {
      let g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2];
      g = (g - 128) * 1.7 + 128;
      g = g < 0 ? 0 : g > 255 ? 255 : g;
      p[i] = p[i + 1] = p[i + 2] = g;
    }
    cx.putImageData(im, 0, 0);
    return cv;
  }
  function parseScanNumber(text) {
    const t = String(text || "").replace(/[^0-9.\s]/g, " ");
    const all = t.match(/\d+(?:\.\d+)?/g);
    if (!all) return null;
    const plaus = all.filter((s) => { const n = Number(s); return isFinite(n) && n > 0 && n < 1000; });
    if (!plaus.length) return null;
    const withDot = plaus.filter((s) => s.includes("."));
    const pool = withDot.length ? withDot : plaus;
    const pick = pool.map(Number).sort((a, b) => b - a)[0];
    return Math.floor(pick * 10) / 10; // xx.xx -> xx.x (dipangkas, bukan dibulatkan)
  }
  async function handleScan(input, target) {
    const files = input.files ? Array.from(input.files) : [];
    input.value = "";
    if (!files.length) return;
    const statusEl = $(target === "ayam" ? "scanAyamStatus" : "scanJerohanStatus");
    try {
      ensureAiChoice();
      const useAi = !!aiKey();
      if (target === "ayam") {
        const ta = $("bobotAyam");
        let okCount = 0, failCount = 0;
        for (let idx = 0; idx < files.length; idx++) {
          statusEl.innerHTML = '<span class="load">🔍 Membaca gambar ' + (idx + 1) + ' dari ' + files.length + (useAi ? ' (AI)...' : '...') + '</span>';
          const num = await readOne(files[idx], statusEl);
          if (num === null) { failCount++; continue; }
          ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + num;
          okCount++;
        }
        omUpdateAyamTotal();
        let msg = '<span class="ok">✅ ' + okCount + ' gambar terbaca & ditambahkan.</span>';
        if (failCount) msg += ' <span class="err">❌ ' + failCount + ' gagal dibaca (isi manual).</span>';
        msg += ' <span class="ok">Cek & koreksi bila perlu.</span>';
        statusEl.innerHTML = msg;
      } else {
        statusEl.innerHTML = '<span class="load">🔍 Membaca angka dari gambar' + (useAi ? ' (AI)' : '') + '...</span>';
        const num = await readOne(files[0], statusEl);
        if (num === null) {
          statusEl.innerHTML = '<span class="err">❌ Angka tidak terbaca. Coba foto lebih dekat/jelas, atau isi manual.</span>';
          return;
        }
        const numJer = Math.floor(num);
        $("bobotJerohan").value = numJer;
        statusEl.innerHTML = '<span class="ok">✅ Terbaca: <b>' + num + '</b> kg → dipakai <b>' + numJer + '</b> kg (jerohan tanpa desimal). Cek & koreksi bila perlu.</span>';
      }
    } catch (err) {
      statusEl.innerHTML = '<span class="err">❌ ' + (err && err.message ? err.message : "Gagal memproses gambar") + '</span>';
    }
  }
  $("omsetPanel").addEventListener("change", (e) => {
    if (!e.target) return;
    if (e.target.id === "scanAyam") handleScan(e.target, "ayam");
    if (e.target.id === "scanJerohan") handleScan(e.target, "jerohan");
  });

  // Delegasi klik di dalam panel omset
  $("omsetPanel").addEventListener("click", (e) => {
    const editBtn = e.target.closest("[data-edit]");
    if (editBtn) { omEditMode(editBtn.dataset.edit); return; }
    const saveBtn = e.target.closest("[data-save]");
    if (saveBtn) { omSavePrice(saveBtn.dataset.save); return; }
    if (e.target.closest("#aiKeyBtn")) { promptAiKey(); return; }
    if (e.target.closest("#calcBtn")) { omCalculate(); return; }
    if (e.target.closest("#strukBtn")) { openStruk(); return; }
    if (e.target.closest("#saveRwBtn")) { saveCurrentToRiwayat(e.target.closest("#saveRwBtn")); return; }
    if (e.target.closest("#riwayatBtn")) { openRiwayat(); return; }
  });

  function showScreen(name) {
    ["Home", "Pesanan", "Omset"].forEach((n) => {
      const el = $("screen" + n);
      if (el) el.hidden = n.toLowerCase() !== name;
    });
    window.scrollTo(0, 0);
  }
  $("goPesanan").addEventListener("click", () => showScreen("pesanan"));
  $("goOmset").addEventListener("click", () => { renderOmset(); updateAiTag(); showScreen("omset"); });
  document.querySelectorAll("[data-home]").forEach((b) => b.addEventListener("click", () => showScreen("home")));

  // Langganan data real-time
  AmyamStore.ready.then(() => {
    const mode = AmyamStore.getMode();
    $("modeBadge").innerHTML =
      mode === "cloud"
        ? '<span class="dot live"></span>'
        : '<span class="dot"></span>';
    $("modeBadge").title = mode === "cloud" ? "Real-time aktif (cloud)" : "Mode lokal (perangkat ini)";
  });
  AmyamStore.subscribe((orders) => {
    allOrders = orders;
    render();
  });
